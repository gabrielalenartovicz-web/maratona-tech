<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Código da Roça - Fake News, Drones e Privacidade</title>
    <style>
        :root {
            --bg-primary: #f0f7ff;
            --bg-secondary: #ffffff;
            --bg-sidebar: #1e3a8a;
            --sidebar-text: #ffffff;
            --sidebar-hover: #2563eb;
            --sidebar-active: #3b82f6;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #2563eb;
            --accent-light: #dbeafe;
            --danger: #ef4444;
            --success: #10b981;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a 0%, #0d9488 100%);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--shadow);
        }

        header h1 {
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .meta-info {
            text-align: right;
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .main-wrapper {
            display: flex;
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 1.5rem auto;
            padding: 0 1rem;
            gap: 1.5rem;
        }

        /* Sidebar com Abas */
        .sidebar {
            width: 300px;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 1rem;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            height: fit-content;
        }

        .sidebar-header {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            padding: 0.5rem;
            font-weight: 700;
            border-bottom: 1px solid var(--border);
            margin-bottom: 0.5rem;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-main);
            padding: 0.85rem 1rem;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tab-btn:hover {
            background-color: var(--accent-light);
            color: var(--accent);
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: white;
            font-weight: 600;
        }

        /* Painel de Conteúdo */
        .content-panel {
            flex: 1;
            background-color: var(--bg-secondary);
            border-radius: 12px;
            padding: 2.5rem;
            box-shadow: var(--shadow);
            min-height: 600px;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 2rem;
            color: #1e3a8a;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--accent-light);
            padding-bottom: 0.5rem;
        }

        h3 {
            font-size: 1.3rem;
            color: #0f172a;
            margin: 1.5rem 0 0.75rem 0;
        }

        p {
            line-height: 1.6;
            color: #334155;
            margin-bottom: 1rem;
            font-size: 1.05rem;
        }

        ul, ol {
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
            color: #334155;
            line-height: 1.6;
        }

        li {
            margin-bottom: 0.5rem;
        }

        .alert-box {
            background-color: #fee2e2;
            border-left: 5px solid var(--danger);
            padding: 1.25rem;
            border-radius: 4px;
            margin: 1.5rem 0;
            color: #991b1b;
        }

        .alert-box h4 {
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .info-card {
            background-color: var(--bg-primary);
            border: 1px solid var(--border);
            padding: 1.25rem;
            border-radius: 8px;
            border-top: 4px solid var(--accent);
        }

        .info-card h4 {
            color: #1e3a8a;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .impact-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1.5rem 0;
        }

        .impact-table th, .impact-table td {
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            text-align: left;
        }

        .impact-table th {
            background-color: var(--accent-light);
            color: #1e3a8a;
            font-weight: 600;
        }

        .impact-table tr:nth-child(even) {
            background-color: #f8fafc;
        }

        .team-list {
            list-style: none;
            margin-left: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .team-member {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            color: #1e3a8a;
            border: 1px solid var(--border);
        }

        .n3-badge {
            background-color: #fef9c3;
            color: #713f12;
            padding: 0.25rem 0.75rem;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid #fef08a;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .link-ref {
            display: inline-block;
            background-color: var(--bg-primary);
            color: var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 0.5rem;
            border: 1px solid var(--border);
        }

        .link-ref:hover {
            background-color: var(--accent-light);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            background-color: var(--bg-secondary);
            margin-top: auto;
        }

        @media (max-width: 850px) {
            .main-wrapper {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
            }
        }
    </style>
</head>

        </div>
